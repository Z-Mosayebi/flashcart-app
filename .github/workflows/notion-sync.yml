name: Notion sync

# Batch sync for ONE nominated account (SYNC_USER_EMAIL), kept for operator use.
#
# This is not the path users take: they connect their own Notion workspace in
# Settings -> Your notes and press "Sync now", which runs the same logic through
# /api/me/notion/sync against their own token. This job can only ever sync the
# single account its secrets point at.
#
# Manual trigger only. The daily schedule was removed because the job has no
# secrets configured and failed every morning; re-add the `schedule` block below
# once NOTION_API_KEY, NOTION_PAGE_IDS, DATABASE_URL, AI_SERVICE_URL and
# SYNC_USER_EMAIL are set in repository secrets.
#
#  schedule:
#    - cron: "0 6 * * *" # daily at 06:00 UTC

on:
  workflow_dispatch: {} # run on demand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Notion sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_IDS: ${{ secrets.NOTION_PAGE_IDS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SERVICE_URL: ${{ secrets.AI_SERVICE_URL }}
          # Cards are per-user — this is the account the synced deck belongs to.
          SYNC_USER_EMAIL: ${{ secrets.SYNC_USER_EMAIL }}
        run: python scripts/sync_notion.py
