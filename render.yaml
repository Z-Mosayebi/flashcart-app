# Render blueprint for the Flashcard AI service.
#
# Deploys ai-service/ as a free web service. Render reads this automatically
# when you point it at this repo ("New → Blueprint"), so the build and start
# commands don't have to be typed into the dashboard by hand.
#
# Note the free plan sleeps after ~15 minutes of inactivity; the next request
# wakes it and takes roughly 30-60 seconds. The web app is written to surface
# that as a retryable error rather than a crash.
services:
  - type: web
    # Keeps its original spelling on purpose: the name fixes the service URL
    # (flashcart-ai.onrender.com), which AI_SERVICE_URL and monitors point at.
    name: flashcart-ai
    runtime: python
    plan: free
    region: frankfurt # closest to the Neon database (eu-central-1)
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render; binding to it (and 0.0.0.0) is required or
    # the service is marked unhealthy and redeployed in a loop.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      # Set in the Render dashboard, not here — this file is committed.
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated list of sites allowed to call this service.
      - key: ALLOWED_ORIGINS
        sync: false
      # Shared with the web app and scheduled sync job. Unlike CORS, this
      # protects direct HTTP requests to the public service.
      - key: AI_SERVICE_AUTH_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
